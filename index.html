<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Act 647 Rabies & Stray Control - Gesture Game</title>
  <style>
    body { font-family: 'Segoe UI', sans-serif; background: #0f172a; color: #f8fafc; text-align: center; margin: 0; padding: 20px; }
    .container { max-width: 720px; margin: auto; background: #1e293b; padding: 20px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.4); }
    video { width: 320px; height: 240px; border-radius: 12px; transform: scaleX(-1); border: 3px solid #38bdf8; background: #000; }
    .question-box { background: #334155; padding: 15px; border-radius: 12px; margin: 15px 0; }
    .options { display: flex; gap: 15px; justify-content: center; margin-top: 10px; }
    .opt { flex: 1; padding: 12px; border-radius: 10px; background: #475569; border: 2px solid transparent; transition: 0.2s; }
    .opt.active { border-color: #facc15; background: #854d0e; }
    .status { font-weight: bold; color: #38bdf8; margin: 10px 0; font-size: 1.1em; }
    button { background: #38bdf8; color: #0f172a; border: none; padding: 10px 20px; font-weight: bold; border-radius: 8px; cursor: pointer; font-size: 1em; }
  </style>
</head>
<body>

<div class="container">
  <h2>🐾 Act 647 Gesture Challenge: Rabies & Stray Control</h2>
  <p>Show <b>1 Finger (☝️)</b> for Option A or <b>2 Fingers (✌️)</b> for Option B and hold for 1.5 seconds!</p>
  
  <button id="startBtn">Enable Webcam & Start Game</button>
  <div style="margin-top:15px;">
    <video id="webcam" autoplay playsinline></video>
  </div>
  <div class="status" id="statusText">Waiting for camera...</div>

  <div class="question-box" id="quizArea" style="display:none;">
    <h3 id="qTitle">Question 1</h3>
    <p id="qText"></p>
    <div class="options">
      <div class="opt" id="optA">☝️ <b>Option A:</b> <span id="textA"></span></div>
      <div class="opt" id="optB">✌️ <b>Option B:</b> <span id="textB"></span></div>
    </div>
  </div>
</div>

<script type="module">
  import { HandLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3";

  const questions = [
    {
      q: "Rabies is confirmed in District X. A resident wants to bring their healthy dog out of the area. What is required under Act 647?",
      a: "Written Movement Permit from DVS",
      b: "Nothing, as long as the dog looks healthy",
      correct: 1
    },
    {
      q: "During house-to-house checks, you find an unlicensed adult dog and an unlicensed cat. Under Section 38, who is liable?",
      a: "Both dog and cat owners are fined",
      b: "Only the dog owner (cats are exempted)",
      correct: 2
    },
    {
      q: "Unlicensed stray dogs are roaming a rabies-infected market. Which sections empower DVS to seize/destroy stray dogs?",
      a: "Sections 39 & 40",
      b: "Section 38 only",
      correct: 1
    }
  ];

  let currentQ = 0, score = 0, handLandmarker, holdTimer = 0, lastGesture = 0;
  const video = document.getElementById("webcam");
  const statusText = document.getElementById("statusText");

  async function initMediaPipe() {
    statusText.innerText = "Loading MediaPipe Hand AI...";
    const vision = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/wasm");
    handLandmarker = await HandLandmarker.createFromOptions(vision, {
      baseOptions: {
        modelAssetPath: "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",
        delegate: "GPU"
      },
      runningMode: "VIDEO",
      numHands: 1
    });
    startCamera();
  }

  async function startCamera() {
    const stream = await navigator.mediaDevices.getUserMedia({ video: true });
    video.srcObject = stream;
    video.addEventListener("loadeddata", () => {
      document.getElementById("startBtn").style.display = "none";
      document.getElementById("quizArea").style.display = "block";
      loadQuestion();
      predictWebcam();
    });
  }

  function loadQuestion() {
    if (currentQ >= questions.length) {
      document.getElementById("quizArea").innerHTML = `<h3>🎉 Mission Complete!</h3><p>Your Score: ${score} / ${questions.length}</p><button onclick="location.reload()">Play Again</button>`;
      statusText.innerText = "All Act 647 scenarios cleared!";
      return;
    }
    const q = questions[currentQ];
    document.getElementById("qTitle").innerText = `Scenario ${currentQ + 1} of ${questions.length}`;
    document.getElementById("qText").innerText = q.q;
    document.getElementById("textA").innerText = q.a;
    document.getElementById("textB").innerText = q.b;
  }

  function countRaisedFingers(landmarks) {
    let count = 0;
    // Index (8 vs 6), Middle (12 vs 10), Ring (16 vs 14), Pinky (20 vs 18)
    if (landmarks[8].y < landmarks[6].y) count++;
    if (landmarks[12].y < landmarks[10].y) count++;
    if (landmarks[16].y < landmarks[14].y) count++;
    if (landmarks[20].y < landmarks[18].y) count++;
    return count;
  }

  async function predictWebcam() {
    if (currentQ < questions.length) {
      const results = handLandmarker.detectForVideo(video, performance.now());
      document.getElementById("optA").classList.remove("active");
      document.getElementById("optB").classList.remove("active");

      if (results.landmarks && results.landmarks.length > 0) {
        const fingers = countRaisedFingers(results.landmarks[0]);
        if (fingers === 1 || fingers === 2) {
          document.getElementById(fingers === 1 ? "optA" : "optB").classList.add("active");
          statusText.innerText = `Detected ${fingers} finger(s)... Hold steady!`;
          
          if (lastGesture === fingers) {
            holdTimer++;
            if (holdTimer > 35) { // ~1.5 seconds
              checkAnswer(fingers);
              holdTimer = 0;
            }
          } else {
            lastGesture = fingers;
            holdTimer = 0;
          }
        } else {
          statusText.innerText = "Show 1 finger (A) or 2 fingers (B)";
          holdTimer = 0;
        }
      } else {
        statusText.innerText = "Place your hand in front of the camera";
        holdTimer = 0;
      }
      requestAnimationFrame(predictWebcam);
    }
  }

  function checkAnswer(choice) {
    if (choice === questions[currentQ].correct) {
      score++;
      alert("✅ Correct! Good statutory compliance under Act 647.");
    } else {
      alert("❌ Incorrect! Review Act 647 provisions and try the next scenario.");
    }
    currentQ++;
    loadQuestion();
  }

  document.getElementById("startBtn").addEventListener("click", initMediaPipe);
</script>
</body>
</html>
